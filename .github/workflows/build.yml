name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7"

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -fsSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -q templates.tpz
          mv templates/* "$dest/"
          godot --version

      - name: Import project
        run: godot --headless --import || true

      - name: Smoke test (main menu, headless, fail on script errors)
        run: |
          godot --headless --path . --quit-after 600 2>&1 | tee run.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compile Error" run.log; then
            echo "::error::Script errors found while running the game"
            exit 1
          fi

      - name: Mission smoke test (every mission runs 150 simulated seconds)
        run: |
          godot --headless --path . --fixed-fps 30 --quit-after 120000 -- --test=smoke 2>&1 | tee smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compile Error" smoke.log; then
            echo "::error::Script errors found during the mission smoke test"
            exit 1
          fi
          grep -q "TEST PASS smoke" smoke.log || { echo "::error::Mission smoke test did not finish"; exit 1; }

      - name: Campaign test (scripted playthrough of all ten missions)
        run: |
          godot --headless --path . --fixed-fps 30 --quit-after 250000 -- --test=campaign 2>&1 | tee campaign.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Compile Error" campaign.log; then
            echo "::error::Script errors found during the campaign test"
            exit 1
          fi
          grep -q "TEST PASS campaign" campaign.log || { echo "::error::Campaign test failed"; exit 1; }

      - name: Export Linux
        run: |
          mkdir -p build/linux
          godot --headless --export-release "Linux" build/linux/Ashfall.x86_64

      - name: Export Windows
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows" build/windows/Ashfall.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Ashfall-linux
          path: build/linux/

      - uses: actions/upload-artifact@v4
        with:
          name: Ashfall-windows
          path: build/windows/
